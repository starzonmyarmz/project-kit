_subdirectory: template
_min_copier_version: "9.4"
_answers_file: .copier-answers.yml
_exclude:
  - .DS_Store
_skip_if_exists:
  - README.md
  - CHANGELOG.md
  - DESIGN.md
  - VOICE.md
  - Cargo.lock
  - plugin/Cargo.toml
  - plugin/src/**
  - plugin/tests/**
  - ui/**

name:
  type: str
  help: Repo and crate/package name (kebab-case)
  validator: "{% if not (name | regex_search('^[a-z][a-z0-9-]*$')) %}Use lowercase letters, digits and dashes{% endif %}"

display_name:
  type: str
  help: Name people see
  default: "{{ name | replace('-', ' ') | title }}"

description:
  type: str
  help: One sentence, used for the README one-liner and the GitHub description

owner:
  type: str
  default: starzonmyarmz

author:
  type: str
  default: Daniel Marino

year:
  type: int
  help: Copyright year

stack:
  type: str
  help: What kind of project
  choices:
    Rust audio plugin (VST3 + CLAP): rust-plugin
    Mac app (SwiftPM): swift-app
    Something else (version from tags only): other

crate:
  type: str
  default: "{{ name | replace('-', '_') }}"
  when: false

type_name:
  type: str
  default: "{{ display_name | regex_replace('[^A-Za-z0-9]', '') }}"
  when: false

clap_id:
  type: str
  help: CLAP plugin ID (never change it after the first release)
  default: "com.danmarino.{{ name | replace('-', '') }}"
  when: "{{ stack == 'rust-plugin' }}"

vst3_class_id:
  type: str
  help: VST3 class ID, exactly 16 ASCII characters (never change it after the first release)
  default: "{{ ((display_name | regex_replace('[^A-Za-z0-9]', '')) ~ 'DanMarino________')[:16] }}"
  when: "{{ stack == 'rust-plugin' }}"
  validator: "{% if vst3_class_id | length != 16 %}Must be exactly 16 characters{% endif %}"

public:
  type: bool
  help: Public repo?
  default: true

ships:
  type: str
  help: Where releases go
  multiselect: true
  default: [github-release]
  choices:
    GitHub release: github-release
    Homebrew cask: homebrew-cask
    Homebrew formula: homebrew-formula
    itch.io: itch
    GitHub Pages site: pages

design_doc:
  type: bool
  help: Add DESIGN.md (anything with a UI)?
  default: "{{ stack in ['rust-plugin', 'swift-app'] }}"

voice_doc:
  type: bool
  help: Add VOICE.md (anything with copy or personality)?
  default: false

oss_community:
  type: bool
  help: Add CONTRIBUTING, SECURITY, CODE_OF_CONDUCT and issue forms?
  default: false
  when: "{{ public }}"
