_subdirectory: template
_min_copier_version: "9.4"
_answers_file: .copier-answers.yml
_exclude:
  - .DS_Store
_skip_if_exists:
  - README.md
  - CHANGELOG.md
  - DESIGN.md
  - VOICE.md
  - Cargo.lock
  - plugin/Cargo.toml
  - plugin/src/**
  - plugin/tests/**
  - ui/**
  - Package.swift
  - Sources/**
  - Tests/**
  - packaging/**

name:
  type: str
  help: Repo and crate/package name (kebab-case)
  validator: "{% if not (name | regex_search('^[a-z][a-z0-9-]*$')) %}Use lowercase letters, digits and dashes{% endif %}"

display_name:
  type: str
  help: Name people see
  default: "{{ name | replace('-', ' ') | title }}"

description:
  type: str
  help: One sentence, used for the README one-liner and the GitHub description

owner:
  type: str
  default: starzonmyarmz

author:
  type: str
  default: Daniel Marino

year:
  type: int
  help: Copyright year

stack:
  type: str
  help: What kind of project
  choices:
    VST plugin (VST3 + CLAP): vst-plugin
    Mac app (SwiftPM): swift-app
    Something else (version from tags only): other

crate:
  type: str
  default: "{{ name | replace('-', '_') }}"
  when: false

type_name:
  type: str
  default: "{{ display_name | regex_replace('[^A-Za-z0-9]', '') }}"
  when: false

app_id:
  type: str
  help: App ID, used as the bundle ID or CLAP ID (never change it after the first release)
  default: "com.iamdanielmarino.{{ name }}"
  when: "{{ stack in ['vst-plugin', 'swift-app'] }}"

vst3_class_id:
  type: str
  help: VST3 class ID, exactly 16 ASCII characters (never change it after the first release)
  default: "{{ ((display_name | regex_replace('[^A-Za-z0-9]', '')) ~ 'DanielMarino________________')[:16] }}"
  when: "{{ stack == 'vst-plugin' }}"
  validator: "{% if vst3_class_id | length != 16 %}Must be exactly 16 characters{% endif %}"

starter:
  type: bool
  help: Include the starter-only files (example engine, golden render and UI mock, or example app and test)? Say no when adopting an existing repo.
  default: true
  when: "{{ stack in ['vst-plugin', 'swift-app'] }}"

goldens:
  type: bool
  help: Test the engine against golden renders (test helpers, bless-goldens skill)?
  default: true
  when: "{{ stack == 'vst-plugin' }}"

screenshot:
  type: bool
  help: Take the README screenshot from the editor's mock (scripts, workflow, skill)?
  default: true
  when: "{{ stack == 'vst-plugin' }}"

menu_bar:
  type: bool
  help: Menu bar app, with no Dock icon or main window?
  default: false
  when: "{{ stack == 'swift-app' }}"

public:
  type: bool
  help: Public repo?
  default: true

ships:
  type: str
  help: Where releases go
  multiselect: true
  default: [github-release]
  choices:
    GitHub release: github-release
    Homebrew cask: homebrew-cask
    Homebrew formula: homebrew-formula
    itch.io: itch
    GitHub Pages site: pages

design_doc:
  type: bool
  help: Add DESIGN.md (anything with a UI)?
  default: "{{ stack in ['vst-plugin', 'swift-app'] }}"

voice_doc:
  type: bool
  help: Add VOICE.md (anything with copy or personality)?
  default: false

sponsors:
  type: bool
  help: Show the Sponsor button, with GitHub Sponsors and Ko-fi (FUNDING.yml)?
  default: "{{ public }}"
  when: "{{ public }}"

oss_community:
  type: bool
  help: Add CONTRIBUTING, SECURITY, CODE_OF_CONDUCT and issue forms?
  default: false
  when: "{{ public }}"
